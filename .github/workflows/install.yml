# The install, timed (roadmap 2.1, plans/03-install-update-packages.md §8.1): a fresh Windows
# runner installs this branch the way a person does, with bootstrap.ps1, as a standard user (the
# install refuses to run as admin, and 2.9 says it needs none), then runs omawin check.
#
# What it can't show: runners have no WSL (no nested virtualization) and no desktop to start, and
# their image already has Git, Node and PowerShell 7, so it's faster than a clean PC. The Sandbox
# run (omawin sandbox test, 7.1) stays the honest clean test. This job gives the trend.
#
# The standard user runs through a scheduled task (a real logon with a profile): Start-Process
# -Credential from the runner's service session can't make a desktop for the new user.
#
# This branch's release is built first (release.yml, unpublished: the tools bundle, the menu
# app, the helpers) and laid out in C:\mirror, which the install reads instead of GitHub
# (OMAWIN_RELEASE_URL). So the time is the install of this code, without the build: what a PC
# pays once the release is out, minus the download (the next step: time it against the real one).
name: Install

on:
  workflow_dispatch:
  schedule:
    - cron: '43 3 * * 1'   # Mondays, for the trend
  push:
    branches: [main, 'claude/**']
    paths: ['bootstrap.ps1', 'install.ps1', 'install/**', 'bin/check.ps1', 'bin/migrate.ps1', 'bin/install-binaries.ps1', 'bin/release.ps1', 'bin/noctty.ps1', 'migrations/**', 'src/bundle/**', 'build/**', '.github/workflows/install.yml', '.github/workflows/release.yml']

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/release.yml
    with:
      version: v0.0.0-ci
    # release.yml's publish job asks for these; it doesn't run here (nothing is published), but a
    # called workflow can't ask for more than its caller allows.
    permissions:
      contents: write
      id-token: write
      attestations: write

  install:
    needs: build
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: C:\built
      - name: The release, laid out as GitHub would serve it
        shell: pwsh
        run: |
          .\build\release.ps1 -Tag v0.0.0-ci -InDir C:\built -OutDir C:\mirror -Arch x64
          Get-ChildItem C:\mirror | Format-Table Name, Length

      - uses: ./.github/actions/time-install
        with:
          release-url: C:\mirror
          release-tag: v0.0.0-ci
          fresh: 'true'

      # Where unpacking's time goes (a question for the bundle's format): decompressing alone
      # against writing the files, the zips against the same tools as .tar.zst, and git's
      # self-extractor. Windows' own tar.exe does all of it, as the install does.
      - name: Unpacking, measured
        if: always()
        shell: pwsh
        run: |
          $tar = "$env:WINDIR\System32\tar.exe"
          $version = (& $tar --version) -join ' '
          $lines = @('## Unpacking, measured', '', "tar: $version", '', '| Tool | Format | MB | Files | Decompress only (s) | To disk (s) |', '|---|---|---|---|---|---|')
          function Time([scriptblock]$Do) { $c = [Diagnostics.Stopwatch]::StartNew(); & $Do | Out-Null; [math]::Round($c.Elapsed.TotalSeconds, 2) }
          foreach ($name in 'pwsh', 'nvim', 'bun', 'node') {
            $zip = "C:\mirror\omawin-tool-$name.zip"
            if (-not (Test-Path $zip)) { continue }
            $dir = "C:\bench\$name-zip"; New-Item -ItemType Directory -Force $dir | Out-Null
            $only = Time { cmd /c "`"$tar`" -xOf `"$zip`" > NUL" }
            $disk = Time { & $tar -xf $zip -C $dir }
            $files = @(Get-ChildItem $dir -Recurse -File).Count
            $lines += "| $name | zip | $([math]::Round((Get-Item $zip).Length / 1MB)) | $files | $only | $disk |"
            # The same files as a zstd tar, if this tar can write one.
            $zst = "C:\bench\$name.tar.zst"
            & $tar -c --zstd -f $zst -C $dir . 2>$null
            if ($LASTEXITCODE -eq 0 -and (Test-Path $zst)) {
              $dir2 = "C:\bench\$name-zst"; New-Item -ItemType Directory -Force $dir2 | Out-Null
              $only = Time { cmd /c "`"$tar`" -xOf `"$zst`" > NUL" }
              $disk = Time { & $tar -xf $zst -C $dir2 }
              $lines += "| $name | tar.zst | $([math]::Round((Get-Item $zst).Length / 1MB)) | $files | $only | $disk |"
            } else { $lines += "| $name | tar.zst | this tar can't write zstd | | | |" }
          }
          $sfx = 'C:\mirror\omawin-tool-git.exe'
          if (Test-Path $sfx) {
            $dir = 'C:\bench\git'
            $disk = Time { Start-Process $sfx -ArgumentList '-oC:\bench\git', '-y' -Wait -WindowStyle Hidden }
            $lines += "| git | 7z self-extractor | $([math]::Round((Get-Item $sfx).Length / 1MB)) | $(@(Get-ChildItem $dir -Recurse -File).Count) | | $disk |"
          }
          $lines += '', "Cores: $([Environment]::ProcessorCount). Defender's real-time scan is on, as on a PC."
          $lines -join "`n" | Add-Content $env:GITHUB_STEP_SUMMARY
          $lines -join "`n"
