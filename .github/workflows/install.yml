# The install, timed (roadmap 2.1, docs/plan/03-install-update-packages.md §8.1): a fresh Windows
# runner installs this branch the way a person does, with bootstrap.ps1, as a standard user (the
# install refuses to run as admin, and 2.9 says it needs none), then runs omawin check.
#
# What it can't show: runners have no WSL (no nested virtualization) and no desktop to start, and
# their image already has Git, Node and PowerShell 7, so it's faster than a clean PC. The Sandbox
# run (omawin sandbox test, 7.1) stays the honest clean test. This job gives the trend.
#
# The standard user runs through a scheduled task (a real logon with a profile): Start-Process
# -Credential from the runner's service session can't make a desktop for the new user.
#
# This branch's release is built first (release.yml, unpublished: the tools bundle, the menu
# app, the helpers) and laid out in C:\mirror, which the install reads instead of GitHub
# (OMAWIN_RELEASE_URL). So the time is the install of this code, without the build: what a PC
# pays once the release is out, minus the download (the next step: time it against the real one).
name: Install

on:
  workflow_dispatch:
  schedule:
    - cron: '43 3 * * 1'   # Mondays, for the trend
  push:
    branches: [main, 'claude/**']
    paths: ['bootstrap.ps1', 'install.ps1', 'install/**', 'packages.ps1', 'check.ps1', 'bin/migrate.ps1', 'bin/install-binaries.ps1', 'bin/release.ps1', 'bin/noctty.ps1', 'migrations/**', 'bundle/**', 'build/**', '.github/workflows/install.yml', '.github/workflows/release.yml']

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/release.yml
    with:
      version: v0.0.0-ci
    # release.yml's publish job asks for these; it doesn't run here (nothing is published), but a
    # called workflow can't ask for more than its caller allows.
    permissions:
      contents: write
      id-token: write
      attestations: write

  install:
    needs: build
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: C:\built
      - name: The release, laid out as GitHub would serve it
        shell: pwsh
        run: |
          .\build\release.ps1 -Tag v0.0.0-ci -InDir C:\built -OutDir C:\mirror -Arch x64
          Get-ChildItem C:\mirror | Format-Table Name, Length

      - name: A standard user, and the run for it
        shell: pwsh
        run: |
          $password = [Convert]::ToBase64String((1..24 | ForEach-Object { Get-Random -Max 256 }) -as [byte[]]) + 'a1!'
          $secure = ConvertTo-SecureString $password -AsPlainText -Force
          New-LocalUser -Name omawinci -Password $secure -PasswordNeverExpires -AccountNeverExpires | Out-Null
          Add-LocalGroupMember -Group Users -Member omawinci
          # A scheduled task runs as a batch logon, which Windows Server allows only admins by default.
          $sid = (Get-LocalUser omawinci).SID.Value
          secedit /export /cfg C:\sec.inf /areas USER_RIGHTS | Out-Null
          $inf = Get-Content C:\sec.inf
          $inf = if ($inf -match '^SeBatchLogonRight') { $inf -replace '^(SeBatchLogonRight\s*=.*)$', "`$1,*$sid" } else { $inf -replace '^\[Privilege Rights\]$', "[Privilege Rights]`r`nSeBatchLogonRight = *$sid" }
          $inf | Set-Content C:\sec.inf -Encoding Unicode
          secedit /configure /db C:\sec.sdb /cfg C:\sec.inf /areas USER_RIGHTS | Out-Null
          # The user's own run: copy the checkout to ~/omawin (OMAWIN_LOCAL skips the clone), then
          # the one-line install as written in the README, under Windows PowerShell 5.1.
          New-Item -ItemType Directory -Force C:\ci\out | Out-Null
          Copy-Item -Recurse $env:GITHUB_WORKSPACE C:\ci\repo
          icacls C:\ci /grant 'omawinci:(OI)(CI)M' | Out-Null
          @'
          $ErrorActionPreference = 'Continue'
          $start = Get-Date
          Copy-Item -Recurse C:\ci\repo "$HOME\omawin"
          $env:OMAWIN_LOCAL = '1'; $env:OMAWIN_PLAIN = '1'
          $env:OMAWIN_RELEASE_URL = 'C:\mirror'; $env:OMAWIN_RELEASE = 'v0.0.0-ci'
          try {
              & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$HOME\omawin\bootstrap.ps1" *> C:\ci\out\install.log
              "bootstrap exit $LASTEXITCODE" | Add-Content C:\ci\out\result.txt
          } catch { "bootstrap threw: $_" | Add-Content C:\ci\out\result.txt }
          "seconds $([int]((Get-Date) - $start).TotalSeconds)" | Add-Content C:\ci\out\result.txt
          Copy-Item "$env:LOCALAPPDATA\launcher\install-times.txt" C:\ci\out -ErrorAction SilentlyContinue
          Copy-Item "$env:LOCALAPPDATA\launcher\install*.log" C:\ci\out -ErrorAction SilentlyContinue
          # Its own process writing to a file, with a time limit: piped through this script, a
          # program check starts that keeps running would hold the output open, and this would wait.
          $check = Start-Process pwsh -ArgumentList '-NoProfile', '-File', "$HOME\omawin\check.ps1" -RedirectStandardOutput C:\ci\out\check.log -RedirectStandardError C:\ci\out\check-errors.log -WindowStyle Hidden -PassThru
          $null = $check.Handle  # read now, or Windows PowerShell has no ExitCode for it later
          if ($check.WaitForExit(300000)) { "check exit $($check.ExitCode)" | Add-Content C:\ci\out\result.txt }
          else { $check.Kill(); 'check timed out (5 min)' | Add-Content C:\ci\out\result.txt }
          'done' | Set-Content C:\ci\out\done.txt
          '@ | Set-Content C:\ci\run.ps1 -Encoding utf8
          $action = New-ScheduledTaskAction -Execute powershell.exe -Argument '-NoProfile -ExecutionPolicy Bypass -File C:\ci\run.ps1'
          Register-ScheduledTask -TaskName omawin-ci -Action $action -User omawinci -Password $password -RunLevel Limited | Out-Null

      - name: Install as that user
        shell: pwsh
        run: |
          $start = Get-Date
          Start-ScheduledTask -TaskName omawin-ci
          while (-not (Test-Path C:\ci\out\done.txt) -and ((Get-Date) - $start).TotalMinutes -lt 50) {
            Start-Sleep 10
            $state = (Get-ScheduledTask -TaskName omawin-ci).State
            $last = (Get-ScheduledTaskInfo -TaskName omawin-ci).LastTaskResult
            # 267011 (0x41303): not started yet; 267009 (0x41301): running. Anything else while not
            # running means it ended without writing done.txt.
            if ($state -ne 'Running' -and $last -notin 267011, 267009 -and -not (Test-Path C:\ci\out\done.txt)) {
              Write-Host "the task ended early ($state, result $last)"; break
            }
            if ($last -eq 267011 -and ((Get-Date) - $start).TotalMinutes -gt 3) { Write-Host 'the task never started'; break }
          }
          Get-Content C:\ci\out\result.txt -ErrorAction SilentlyContinue

      - name: Summary
        if: always()
        shell: pwsh
        run: |
          $result = @(Get-Content C:\ci\out\result.txt -ErrorAction SilentlyContinue)
          $seconds = ($result | Where-Object { $_ -like 'seconds *' }) -replace 'seconds ', ''
          $lines = @('## Install, as a standard user on windows-2025', '',
            "Whole install (bootstrap to the end): **$seconds s**", '',
            '| Step | Seconds |', '|---|---|')
          foreach ($t in @(Get-Content C:\ci\out\install-times.txt -ErrorAction SilentlyContinue)) {
            $mode, $step, $s = $t -split '\s+'
            if ($mode -eq 'full') { $lines += "| $step | $s |" }
          }
          $lines += '', '```', $result, '```', '', 'No WSL and no desktop on a runner; Git, Node and PowerShell 7 come preinstalled.'
          $lines -join "`n" | Add-Content $env:GITHUB_STEP_SUMMARY
          Write-Host '--- the last of install.log ---'
          Get-Content C:\ci\out\install.log -Tail 80 -ErrorAction SilentlyContinue
          Write-Host '--- check.log ---'
          Get-Content C:\ci\out\check.log -Tail 60 -ErrorAction SilentlyContinue
          if (-not ($result -contains 'bootstrap exit 0')) { Write-Host '::error::the install did not finish cleanly'; exit 1 }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: install-logs
          path: C:\ci\out
