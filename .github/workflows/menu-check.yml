# Builds the menu app on a Windows desktop and walks through the launcher's Packages page
# (build/menu-check.ps1), recording it. The screenshots, a video and the app's log go to the
# branch ci/menu-check (replaced each run), so they can be read with git alone, and stay
# as artifacts for a week. Never runs on a tag or a release; it builds nothing that ships.
name: Menu check

on:
  push:
    branches: ['claude/**']
    paths: ['menu-app/**', 'launcher/**', 'bin/pkg-*', 'build/menu-check.ps1', 'build/frames-video.py', '.github/workflows/menu-check.yml']
  workflow_dispatch:

concurrency:
  group: menu-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '9.0.x'

      - name: Build and walk through the Packages page
        shell: pwsh
        run: .\build\menu-check.ps1 -Out out\menu-check

      - name: Video
        if: always()
        shell: bash
        run: |
          python -m pip install --quiet pillow imageio-ffmpeg
          mkdir -p results
          if [ -d out/menu-check/frames ]; then python build/frames-video.py out/menu-check results/packages.mp4 'Packages page'; fi
          cp -r out/menu-check/shots results/ 2>/dev/null || true
          cp out/menu-check/events.txt out/menu-check/system-menu.log results/ 2>/dev/null || true

      - name: Publish to ci/menu-check
        if: always()
        shell: bash
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd results
          git init -q
          git checkout -q -b ci/menu-check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "Menu check: run ${{ github.run_id }} on ${{ github.sha }}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}" ci/menu-check

      - name: Keep the recording
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: menu-check
          path: out/menu-check/
          retention-days: 7
