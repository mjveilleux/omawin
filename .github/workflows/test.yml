# Unit tests for the pure parts of the menu app (One Search, the settings catalog, plugins) and
# of the omawin command (routing and actions, against the real bin/commands.txt). They need no Windows, so they run on Linux: quicker and cheaper.
name: Test

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Menu app
        run: dotnet test menu-app.Tests --logger "console;verbosity=normal"
      - name: omawin command
        run: dotnet test cli.Tests --logger "console;verbosity=normal"
      - name: omawin command builds with Native AOT
        run: dotnet publish cli -c Release -r linux-x64 -o out/cli && out/cli/omawin --version
