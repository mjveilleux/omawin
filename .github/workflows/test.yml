# Unit tests for the menu app's pure parts (One Search's parser and ranking; later the settings
# catalog's parser). They need no Windows, so they run on Linux: quicker and cheaper.
name: Test

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Unit tests
        run: dotnet test menu-app.Tests --logger "console;verbosity=normal"
