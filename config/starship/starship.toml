add_newline = true
command_timeout = 200
# The side mark first: Arch's, Ubuntu's or Windows' logo, coloured by side, so a Linux prompt never
# looks like a PowerShell one (roadmap 3B). Each env_var module shows only where its variable is
# set: OMAWIN_LINUX by config/bash/bashrc in Linux, OMAWIN_WINDOWS by the PowerShell profile and
# Git Bash. Nothing is started per prompt.
format = "${env_var.OMAWIN_LINUX}${env_var.OMAWIN_WINDOWS}[$directory$git_branch$git_status]($style)$character"

[env_var.OMAWIN_LINUX]
format = "[$env_value ]($style)"
style = "bold green"

[env_var.OMAWIN_WINDOWS]
format = "[$env_value ]($style)"
style = "bold blue"

[character]
error_symbol = "[✗](bold cyan)"
success_symbol = "[❯](bold cyan)"

[directory]
truncation_length = 2
truncation_symbol = "…/"
repo_root_style = "bold cyan"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$branch]($style) "
style = "italic cyan"

[git_status]
format     = '[$all_status]($style)'
style      = "cyan"
ahead      = "⇡${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
behind     = "⇣${count} "
conflicted = " "
up_to_date = " "
untracked  = "? "
modified   = " "
stashed    = ""
staged     = ""
renamed    = ""
deleted    = ""
