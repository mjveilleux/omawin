<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>omawin One Search</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#101018}
a{color:#7aa2f7}a:hover{color:#a9c1fb}
.os-input::placeholder{color:#7f88b2}
.os-input:focus{outline:none}
.os-row:focus-visible,.os-chip:focus-visible,.os-tile:focus-visible,.os-btn:focus-visible{outline:2px solid #7aa2f7;outline-offset:2px}
.os-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</helmet>
<div style="width: 1120px; height: 720px; box-sizing: border-box; position: relative; background: #0c0c13; font-family: Inter, 'Segoe UI', system-ui, sans-serif; color: #c0caf5; overflow: hidden">

  <div style="position: absolute; left: 0; top: 0; right: 0; height: 28px; background: transparent; border-bottom: 1px solid rgba(255,255,255,0.04); display: flex; align-items: center; gap: 14px; padding: 0 16px; box-sizing: border-box; font-size: 11px; letter-spacing: 0.08em; color: #8089b3; font-family: 'JetBrains Mono', monospace">
    <span style="color: #7aa2f7">1</span><span>2</span><span>3</span>
    <span style="flex-grow: 1"></span>
    <span>Fri 30 Oct  14:32</span>
  </div>

  <div style="position: absolute; left: 120px; top: 64px; width: 880px; height: 600px; box-sizing: border-box; background: rgba(22,23,33,0.94); border: 1px solid rgba(122,162,247,0.16); border-radius: 20px; box-shadow: 0 40px 100px rgba(0,0,0,0.6), 0 0 80px rgba(122,162,247,0.07); display: flex; flex-direction: column; overflow: hidden">

    <div style="display: flex; align-items: center; gap: 12px; padding: 20px 24px 14px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7aa2f7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <sc-if value="{{scopeOn}}" hint-placeholder-val="{{ false }}">
        <button class="os-btn" type="button" onClick="{{clearScope}}" aria-label="Remove filter" style="display: flex; align-items: center; gap: 6px; border: none; cursor: pointer; font: 500 11px 'JetBrains Mono', monospace; letter-spacing: 0.08em; text-transform: uppercase; padding: 5px 10px; border-radius: 999px; color: {{scopeColor}}; background: transparent; box-shadow: inset 0 0 0 1px {{scopeColor}}">{{scopeLabel}}<span aria-hidden="true">×</span></button>
      </sc-if>
      <label for="os-q" class="os-sr">Search apps, settings, files and commands</label>
      <input id="os-q" class="os-input" autoFocus="{{ true }}" autoComplete="off" spellCheck="{{ false }}" value="{{q}}" onChange="{{onQuery}}" onKeyDown="{{onKey}}" placeholder="{{placeholder}}" style="flex-grow: 1; background: transparent; border: none; color: #e2e7ff; font: 300 24px Inter, sans-serif; letter-spacing: -0.01em; padding: 4px 0; min-width: 0; caret-color: #7aa2f7">
      <span style="font: 500 10px 'JetBrains Mono', monospace; letter-spacing: 0.12em; text-transform: uppercase; color: #8089b3">Tab · filter</span>
    </div>

    <div role="toolbar" aria-label="Filters" style="display: flex; gap: 2px; padding: 0 16px; border-bottom: 1px solid rgba(255,255,255,0.05); flex-wrap: wrap">
      <sc-for list="{{chips}}" as="c" hint-placeholder-count="9">
        <button class="os-chip" type="button" onClick="{{c.pick}}" aria-pressed="{{c.on}}" style="{{c.style}}">{{c.label}}<sc-if value="{{c.hasCount}}" hint-placeholder-val="{{ false }}"><span style="font: 500 10px 'JetBrains Mono', monospace; opacity: 0.75; transform: translateY(-4px)">{{c.count}}</span></sc-if></button>
      </sc-for>
    </div>

    <div style="flex-grow: 1; display: flex; min-height: 0; position: relative">

      <sc-if value="{{showHome}}" hint-placeholder-val="{{ true }}">
        <div style="flex-grow: 1; padding: 20px 24px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: 96px; gap: 12px; overflow: hidden">
          <button class="os-tile" type="button" onClick="{{openTerminal}}" style="grid-column: span 2; grid-row: span 2; border: 1px solid rgba(255,255,255,0.05); background: rgba(255,255,255,0.025); border-radius: 18px; padding: 18px; text-align: left; color: #c0caf5; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#7aa2f7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>
            <span><span style="display: block; font: 300 28px Inter, sans-serif; letter-spacing: -0.02em; color: #e2e7ff">Terminal</span><span style="display: block; font: 12px 'JetBrains Mono', monospace; color: #9aa5ce; margin-top: 6px">arch · ~/src/omawin</span></span>
          </button>
          <button class="os-tile" type="button" onClick="{{goProjects}}" style="grid-column: span 2; border: 1px solid rgba(255,255,255,0.05); background: rgba(255,255,255,0.025); border-radius: 18px; padding: 14px 16px; text-align: left; color: #c0caf5; cursor: pointer">
            <span style="display: block; font: 500 10px 'JetBrains Mono', monospace; letter-spacing: 0.12em; text-transform: uppercase; color: #ff9e64">Projects</span>
            <span style="display: block; font: 13px 'JetBrains Mono', monospace; color: #a9b1d6; margin-top: 8px; line-height: 1.6">omawin · glazewm · app</span>
          </button>
          <button class="os-tile" type="button" onClick="{{goClip}}" style="grid-column: span 2; border: 1px solid rgba(255,255,255,0.05); background: rgba(255,255,255,0.025); border-radius: 18px; padding: 14px 16px; text-align: left; color: #c0caf5; cursor: pointer">
            <span style="display: block; font: 500 10px 'JetBrains Mono', monospace; letter-spacing: 0.12em; text-transform: uppercase; color: #73daca">Clipboard</span>
            <span style="display: block; font: 13px 'JetBrains Mono', monospace; color: #a9b1d6; margin-top: 8px">npm run dev</span>
          </button>
          <sc-for list="{{quick}}" as="t" hint-placeholder-count="4">
            <button class="os-tile" type="button" onClick="{{t.pick}}" aria-pressed="{{t.on}}" style="{{t.style}}">
              <span style="display: block; font: 400 14px Inter, sans-serif">{{t.name}}</span>
              <span style="display: flex; align-items: center; gap: 6px; font: 500 10px 'JetBrains Mono', monospace; letter-spacing: 0.12em; text-transform: uppercase; margin-top: 12px"><span style="{{t.dot}}"></span>{{t.state}}</span>
            </button>
          </sc-for>
          <button class="os-tile" type="button" onClick="{{goThemes}}" style="grid-column: span 2; border: 1px solid rgba(255,255,255,0.05); background: rgba(255,255,255,0.025); border-radius: 18px; padding: 14px 16px; text-align: left; color: #c0caf5; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between">
            <span style="display: flex; justify-content: space-between; align-items: baseline"><span style="font: 500 10px 'JetBrains Mono', monospace; letter-spacing: 0.12em; text-transform: uppercase; color: #8089b3">Theme</span><span style="font: 300 15px Inter, sans-serif; color: #e2e7ff">Tokyo Night</span></span>
            <span aria-hidden="true" style="display: block; height: 14px; border-radius: 999px; background: linear-gradient(90deg, #7aa2f7 0%, #7dcfff 20%, #9ece6a 40%, #e0af68 60%, #f7768e 80%, #bb9af7 100%); box-shadow: 0 0 24px rgba(122,162,247,0.25)"></span>
          </button>
          <sc-for list="{{frequent}}" as="f" hint-placeholder-count="2">
            <button class="os-tile" type="button" onClick="{{f.pick}}" style="border: 1px solid rgba(255,255,255,0.05); background: rgba(255,255,255,0.025); border-radius: 18px; padding: 14px 16px; text-align: left; color: #c0caf5; cursor: pointer; display: flex; align-items: center; gap: 10px">
              <span style="width: 32px; height: 32px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font: 500 14px Inter, sans-serif; color: {{f.color}}; box-shadow: inset 0 0 0 1px {{f.color}}">{{f.letter}}</span>
              <span style="font: 400 14px Inter, sans-serif; color: #e2e7ff">{{f.name}}</span>
            </button>
          </sc-for>
        </div>
      </sc-if>

      <sc-if value="{{showList}}" hint-placeholder-val="{{ false }}">
        <div role="listbox" aria-label="Results" style="flex: 1 1 0; min-width: 0; padding: 10px 12px; overflow: hidden; display: flex; flex-direction: column; gap: 2px">
          <sc-for list="{{rows}}" as="r" hint-placeholder-count="8">
            <button class="os-row" type="button" role="option" aria-selected="{{r.isSel}}" onClick="{{r.pick}}" style="{{r.style}}">
              <span style="width: 30px; height: 30px; flex-shrink: 0; border-radius: 9px; display: flex; align-items: center; justify-content: center; color: {{r.color}}; background: transparent">
                <sc-if value="{{r.icLetter}}" hint-placeholder-val="{{ false }}"><span style="font: 700 14px Inter, sans-serif">{{r.letter}}</span></sc-if>
                <sc-if value="{{r.icSetting}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><rect x="2" y="7" width="20" height="10" rx="5"></rect><circle cx="16" cy="12" r="2.5"></circle></svg></sc-if>
                <sc-if value="{{r.icCommand}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg></sc-if>
                <sc-if value="{{r.icFile}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><polyline points="14 3 14 9 20 9"></polyline></svg></sc-if>
                <sc-if value="{{r.icWindow}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line></svg></sc-if>
                <sc-if value="{{r.icProject}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg></sc-if>
                <sc-if value="{{r.icClip}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="3" width="8" height="4" rx="1"></rect><path d="M16 5h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2"></path></svg></sc-if>
                <sc-if value="{{r.icTheme}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="8.5" cy="10" r="1.2"></circle><circle cx="12" cy="7.5" r="1.2"></circle><circle cx="15.5" cy="10" r="1.2"></circle></svg></sc-if>
                <sc-if value="{{r.icPackage}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M21 8l-9-5-9 5 9 5 9-5z"></path><path d="M3 8v8l9 5 9-5V8"></path></svg></sc-if>
                <sc-if value="{{r.icWeb}}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><line x1="3" y1="12" x2="21" y2="12"></line><path d="M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18z"></path></svg></sc-if>
                <sc-if value="{{r.icCalc}}" hint-placeholder-val="{{ false }}"><span style="font: 700 16px 'JetBrains Mono', monospace">=</span></sc-if>
                <sc-if value="{{r.icMore}}" hint-placeholder-val="{{ false }}"><span style="font: 700 14px Inter, sans-serif">…</span></sc-if>
              </span>
              <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
                <span style="font: 400 14px Inter, sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis"><sc-for list="{{r.parts}}" as="p" hint-placeholder-count="1"><span style="{{p.style}}">{{p.t}}</span></sc-for></span>
                <span style="font: 12px Inter, sans-serif; color: #9aa5ce; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.sub}}</span>
              </span>
              <sc-if value="{{r.hasPill}}" hint-placeholder-val="{{ false }}"><span style="{{r.pillStyle}}">{{r.pill}}</span></sc-if>
              <span style="{{r.tagStyle}}">{{r.tagLabel}}</span>
            </button>
          </sc-for>
          <sc-if value="{{noResults}}" hint-placeholder-val="{{ false }}">
            <div style="padding: 40px 20px; text-align: center; color: #9aa5ce; font: 14px Inter, sans-serif">Nothing here. Backspace removes the filter.</div>
          </sc-if>
        </div>

        <div style="width: 300px; flex-shrink: 0; border-left: 1px solid rgba(255,255,255,0.05); padding: 22px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; background: transparent">
          <sc-if value="{{hasSel}}" hint-placeholder-val="{{ true }}">
            <div style="display: flex; align-items: center; gap: 12px">
              <span style="width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font: 300 20px Inter, sans-serif; color: {{pv.color}}; box-shadow: inset 0 0 0 1px {{pv.color}}, 0 0 24px {{pv.glow}}">{{pv.letter}}</span>
              <span style="min-width: 0"><span style="display: block; font: 400 17px Inter, sans-serif; color: #e2e7ff">{{pv.name}}</span><span style="display: block; font: 600 11px 'JetBrains Mono', monospace; color: {{pv.color}}; margin-top: 3px; text-transform: uppercase; letter-spacing: 0.06em">{{pv.tag}}</span></span>
            </div>
            <p style="margin: 0; font: 13px/1.55 Inter, sans-serif; color: #a9b1d6">{{pv.desc}}</p>
            <sc-if value="{{pv.isSwitch}}" hint-placeholder-val="{{ false }}">
              <button class="os-btn" type="button" onClick="{{activate}}" aria-pressed="{{pv.on}}" style="{{pv.switchStyle}}"><span>{{pv.stateText}}</span><span style="font: 500 11px 'JetBrains Mono', monospace; opacity: 0.85">Enter</span></button>
            </sc-if>
            <sc-if value="{{pv.isChoice}}" hint-placeholder-val="{{ false }}">
              <button class="os-btn" type="button" onClick="{{activate}}" style="display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(255,255,255,0.08); background: transparent; color: #e2e7ff; border-radius: 12px; padding: 12px 14px; font: 400 14px Inter, sans-serif; cursor: pointer"><span>{{pv.value}}</span><span style="font: 500 11px 'JetBrains Mono', monospace; color: #9aa5ce">Enter: next</span></button>
            </sc-if>
            <sc-if value="{{pv.isOpen}}" hint-placeholder-val="{{ false }}">
              <button class="os-btn" type="button" onClick="{{activate}}" style="display: flex; justify-content: space-between; align-items: center; border: 1px solid #7aa2f7; background: rgba(122,162,247,0.1); color: #b4c8fb; border-radius: 12px; padding: 12px 14px; font: 500 14px Inter, sans-serif; cursor: pointer; box-shadow: 0 0 24px rgba(122,162,247,0.15)"><span>{{pv.verb}}</span><span style="font: 500 11px 'JetBrains Mono', monospace">Enter</span></button>
            </sc-if>
            <div style="display: flex; flex-direction: column; gap: 8px; margin-top: 4px">
              <sc-for list="{{pv.facts}}" as="fa" hint-placeholder-count="2">
                <div style="display: flex; flex-direction: column; gap: 2px"><span style="font: 600 11px Inter, sans-serif; color: #7f88b2; text-transform: uppercase; letter-spacing: 0.05em">{{fa.k}}</span><span style="font: 13px 'JetBrains Mono', monospace; color: #c0caf5; word-break: break-all">{{fa.v}}</span></div>
              </sc-for>
            </div>
            <sc-if value="{{pv.isTheme}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="{{pv.barStyle}}"></span></sc-if>
            <span style="flex-grow: 1"></span>
            <button class="os-btn" type="button" onClick="{{toggleActions}}" style="display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(255,255,255,0.06); background: transparent; color: #a9b1d6; border-radius: 12px; padding: 10px 14px; font: 400 13px Inter, sans-serif; cursor: pointer"><span>More actions</span><span style="font: 500 11px 'JetBrains Mono', monospace">Ctrl K</span></button>
          </sc-if>
        </div>
      </sc-if>

      <sc-if value="{{actionsOn}}" hint-placeholder-val="{{ false }}">
        <div role="menu" aria-label="Actions" style="position: absolute; right: 316px; bottom: 12px; width: 280px; background: rgba(30,32,46,0.98); border: 1px solid rgba(122,162,247,0.18); border-radius: 14px; padding: 6px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 2px">
          <sc-for list="{{actions}}" as="ac" hint-placeholder-count="4">
            <button class="os-btn" type="button" role="menuitem" onClick="{{ac.pick}}" style="display: flex; justify-content: space-between; align-items: center; border: none; background: transparent; color: #c0caf5; border-radius: 8px; padding: 9px 10px; font: 500 13px Inter, sans-serif; cursor: pointer; text-align: left"><span>{{ac.label}}</span><span style="font: 11px 'JetBrains Mono', monospace; color: #9aa5ce">{{ac.key}}</span></button>
          </sc-for>
        </div>
      </sc-if>

      <sc-if value="{{toastOn}}" hint-placeholder-val="{{ false }}">
        <div role="status" style="position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); background: rgba(30,32,46,0.98); color: #e2e7ff; border: 1px solid rgba(122,162,247,0.3); border-radius: 999px; padding: 9px 16px; font: 400 13px Inter, sans-serif; box-shadow: 0 0 30px rgba(122,162,247,0.15); white-space: nowrap">{{toast}}</div>
      </sc-if>
    </div>

    <div style="display: flex; gap: 20px; padding: 10px 24px; border-top: 1px solid rgba(255,255,255,0.05); font: 10px 'JetBrains Mono', monospace; letter-spacing: 0.08em; text-transform: uppercase; color: #8089b3; flex-wrap: wrap">
      <span><span style="color: #c0caf5">Enter</span> open or switch</span>
      <span><span style="color: #c0caf5">Ctrl K</span> actions</span>
      <span><span style="color: #c0caf5">Tab</span> filter</span>
      <span><span style="color: #c0caf5">/</span> files</span>
      <span><span style="color: #c0caf5">&gt;</span> commands</span>
      <span><span style="color: #c0caf5">Ctrl Z</span> undo</span>
      <span><span style="color: #c0caf5">Esc</span> back</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1120,"height":720}}'>
var TAGS = [
  { id: 'all', label: 'All', color: '#c0caf5' },
  { id: 'app', label: 'Apps', color: '#7aa2f7' },
  { id: 'setting', label: 'Settings', color: '#9ece6a' },
  { id: 'command', label: 'Commands', color: '#e0af68' },
  { id: 'file', label: 'Files', color: '#7dcfff' },
  { id: 'window', label: 'Windows', color: '#bb9af7' },
  { id: 'project', label: 'Projects', color: '#ff9e64' },
  { id: 'clip', label: 'Clipboard', color: '#73daca' },
  { id: 'theme', label: 'Themes', color: '#f7768e' }
];
var TAG = {};
TAGS.forEach(function (t) { TAG[t.id] = t; });
TAG.package = { id: 'package', label: 'Packages', color: '#9aa5ce' };
TAG.web = { id: 'web', label: 'Web', color: '#9aa5ce' };
TAG.calc = { id: 'calc', label: 'Calculator', color: '#e0af68' };
TAG.more = { id: 'more', label: '', color: '#9aa5ce' };

var ITEMS = [
  { id: 'a-term', tag: 'app', name: 'Terminal', sub: 'noctty · opens your Linux (Arch)', kw: 'noctty shell console arch', freq: 10, path: '%LOCALAPPDATA%\\Programs\\noctty' },
  { id: 'a-nvim', tag: 'app', name: 'Neovim', sub: 'Editor, in the terminal', kw: 'vim editor lazyvim', freq: 8, path: 'nvim.exe' },
  { id: 'a-code', tag: 'app', name: 'Visual Studio Code', sub: 'Editor', kw: 'vscode code editor', freq: 5, path: 'Code.exe' },
  { id: 'a-edge', tag: 'app', name: 'Microsoft Edge', sub: 'Browser', kw: 'browser web', freq: 6, path: 'msedge.exe' },
  { id: 'a-firefox', tag: 'app', name: 'Firefox', sub: 'Browser', kw: 'browser web mozilla', freq: 7, path: 'firefox.exe' },
  { id: 'a-slack', tag: 'app', name: 'Slack', sub: 'Chat', kw: 'chat work', freq: 6, path: 'slack.exe' },
  { id: 'a-obsidian', tag: 'app', name: 'Obsidian', sub: 'Notes', kw: 'notes markdown', freq: 4, path: 'Obsidian.exe' },
  { id: 'a-docker', tag: 'app', name: 'Docker Desktop', sub: 'Containers', kw: 'containers', freq: 2, path: 'Docker Desktop.exe' },
  { id: 'a-taskmgr', tag: 'app', name: 'Task Manager', sub: 'Windows', kw: 'processes taskmgr', freq: 1, path: 'taskmgr.exe' },
  { id: 'a-paint', tag: 'app', name: 'Paint', sub: 'Windows', kw: 'draw mspaint', freq: 0, path: 'mspaint.exe' },
  { id: 'a-discord', tag: 'app', name: 'Discord', sub: 'Chat', kw: 'chat voice', freq: 3, path: 'Discord.exe' },

  { id: 's-dark', tag: 'setting', name: 'Dark mode', sub: 'Personalization › Colors', kw: 'theme light colors appearance', freq: 4, kind: 'switch', sw: 'dark', where: 'Settings › Personalization › Colors', desc: 'Dark backgrounds for Windows and apps that follow it.' },

var CAPS = { app: 4, setting: 4, command: 3, file: 3, window: 2, project: 2, clip: 2, theme: 3 };

function fuzzy(text, query) {
  var t = text.toLowerCase(), q = query.toLowerCase();
  if (!q) return { score: 1, hits: [] };
  var at = t.indexOf(q);
  if (at >= 0) {
    var hits = [];
    for (var k = 0; k < q.length; k++) hits.push(at + k);
    var base = at === 0 ? 100 : (/[\s\-_.\/·]/.test(t.charAt(at - 1)) ? 85 : 60);
    return { score: base - Math.min(t.length, 40) * 0.3, hits: hits };
  }
  var from = 0, list = [], bonus = 0;
  for (var i = 0; i < q.length; i++) {
    var ch = q.charAt(i);
    if (ch === ' ') continue;
    var f = t.indexOf(ch, from);
    if (f < 0) return null;
    if (f === 0 || /[\s\-_.\/·]/.test(t.charAt(f - 1))) bonus += 8;
    list.push(f); from = f + 1;
  }
  if (!list.length) return null;
  var spread = list[list.length - 1] - list[0];
  if (spread > 18 && bonus < 8) return null;
  return { score: 30 + bonus - spread * 0.6, hits: list };
}

function partsOf(name, hits) {
  var set = {}; hits.forEach(function (h) { set[h] = true; });
  var parts = [], cur = '', curHit = null;
  for (var i = 0; i < name.length; i++) {
    var h = !!set[i];
    if (curHit === null || h === curHit) { cur += name.charAt(i); curHit = h; }
    else { parts.push({ t: cur, hit: curHit }); cur = name.charAt(i); curHit = h; }
  }
  if (cur) parts.push({ t: cur, hit: curHit });
  return parts.map(function (p) { return { t: p.t, style: p.hit ? 'color: #7aa2f7; font-weight: 700' : 'color: #c0caf5' }; });
}

function calcValue(q) {
  if (!/^[\d\s+\-*\/().%]+$/.test(q) || !/\d\s*[+\-*\/%]\s*[\d(]/.test(q)) return null;
  try {
    var v = Function('"use strict"; return (' + q.replace(/%/g, '/100') + ')')();
    if (typeof v !== 'number' || !isFinite(v)) return null;
    return Math.round(v * 1e10) / 1e10;
  } catch (e) { return null; }
}

        if (it.cmd) facts.push({ k: 'Command', v: it.cmd });
        if (it.key) facts.push({ k: 'Key', v: it.key });
        if (it.swatch) { pv.isTheme = true; pv.barStyle = 'display: block; height: 14px; border-radius: 999px; background: linear-gradient(90deg, ' + it.swatch.join(', ') + '); box-shadow: 0 0 24px ' + it.swatch[0] + '40'; }
        if (it.tag === 'window') facts.push({ k: 'Preview', v: 'live thumbnail (DWM) here' });
        if (it.tag === 'clip') facts.push({ k: 'Kept', v: 'skips password managers’ copies' });
        pv.facts = facts;
      } else {
        pv.isOpen = true;
        pv.verb = selEntry.kind === 'more' ? 'Show them all' : (selEntry.kind === 'calc' ? 'Copy the result' : 'Go');
        pv.desc = selEntry.sub;
        pv.facts = [];
      }
    }

    var actions = [];
    if (selEntry && selEntry.kind === 'item') {
      var t2 = selEntry.it.tag;
      var map = {
        app: [['Open', 'Enter'], ['Run as administrator', 'Ctrl Shift Enter'], ['Show in folder', 'Ctrl O'], ['Pin to home', 'Ctrl P'], ['Uninstall…', '']],
        setting: [['Switch it', 'Enter'], ['Open in Settings', 'Ctrl O'], ['Copy its command', 'Ctrl C'], ['Pin to home', 'Ctrl P']],
        file: [['Open', 'Enter'], ['Open in editor', 'Ctrl E'], ['Terminal here', 'Ctrl T'], ['Copy path', 'Ctrl C'], ['Who has it open?', ''], ['Show in Explorer', 'Ctrl O']],
        command: [['Run', 'Enter'], ['Copy command', 'Ctrl C'], ['Pin to home', 'Ctrl P']],
        window: [['Switch to it', 'Enter'], ['Close', 'Ctrl W'], ['Move to workspace…', ''], ['Picture in picture', '']],
        project: [['Open project', 'Enter'], ['Open in editor', 'Ctrl E'], ['Terminal here', 'Ctrl T'], ['Copy path', 'Ctrl C']],
        clip: [['Paste', 'Enter'], ['Paste as plain text', 'Ctrl Shift V'], ['Pin', 'Ctrl P'], ['Delete', 'Ctrl D']],
        theme: [['Apply', 'Enter'], ['Preview', 'Space'], ['Next background', '']]
      };
      actions = (map[t2] || []).map(function (a) { return { label: a[0], key: a[1], pick: function () { self.setState({ actions: false }); self.say(a[0] + ': ' + selEntry.it.name); } }; });
    }

    var quickDefs = [{ key: 'wifi', name: 'Wi-Fi' }, { key: 'bt', name: 'Bluetooth' }, { key: 'dark', name: 'Dark mode' }, { key: 'mic', name: 'Microphone' }];
    var quick = quickDefs.map(function (d) {
      var on = !!s.sw[d.key];
      return {
        name: d.name, on: on, state: on ? 'On' : 'Off',
        style: 'border-radius: 18px; padding: 14px 16px; text-align: left; cursor: pointer; ' + (on ? 'border: 1px solid rgba(158,206,106,0.45); background: rgba(158,206,106,0.07); color: #c3e88d; box-shadow: 0 0 30px -8px rgba(158,206,106,0.35)' : 'border: 1px solid rgba(255,255,255,0.05); background: rgba(255,255,255,0.025); color: #a9b1d6'),
        dot: 'width: 6px; height: 6px; border-radius: 50%; background: ' + (on ? '#9ece6a; box-shadow: 0 0 8px #9ece6a' : '#565f89'),
        pick: function () { var sw = Object.assign({}, self.state.sw); sw[d.key] = !on; self.setState({ sw: sw, last: { type: 'sw', key: d.key, was: on, name: d.name } }); self.say(d.name + (on ? ' off' : ' on') + ' · Ctrl Z undoes'); }
      };
    });
    var frequent = [{ name: 'Firefox', color: '#ff9e64', q: 'firefox' }, { name: 'Slack', color: '#bb9af7', q: 'slack' }].map(function (f) {
      return { name: f.name, color: f.color, letter: f.name.charAt(0), pick: function () { self.say('Opening ' + f.name); } };
    });

    var scopeTag = TAG[r.eff];
    var placeholders = { all: 'Search apps, settings, files, commands…', app: 'Search apps…', setting: 'Search every Windows setting…', command: 'Search commands…', file: 'Search files… (# searches inside them)', window: 'Search open windows…', project: 'Search projects…', clip: 'Search what you copied…', theme: 'Search themes…' };

    return {
      q: s.q,
      placeholder: placeholders[r.eff] || placeholders.all,
      scopeOn: r.eff !== 'all',
      scopeLabel: scopeTag ? scopeTag.label : '',
      scopeColor: scopeTag ? scopeTag.color : '#c0caf5',
      chips: chips,
      showHome: !r.q && r.eff === 'all',
      showList: !!r.q || r.eff !== 'all',
      rows: rows,
      noResults: (!!r.q || r.eff !== 'all') && rows.length === 0,
      hasSel: !!selEntry,
      pv: pv,
      actionsOn: s.actions && actions.length > 0,
      actions: actions,
      toastOn: !!s.toast,
      toast: s.toast,
      quick: quick,
      frequent: frequent,
      openTerminal: function () { self.say('Opening the terminal in Arch'); },
      goProjects: function () { self.setState({ scope: 'project', sel: 0 }); },
      goClip: function () { self.setState({ scope: 'clip', sel: 0 }); },
      goThemes: function () { self.setState({ scope: 'theme', sel: 0 }); },
      clearScope: function () { self.setState({ scope: 'all', sel: 0, q: (self.state.q.charAt(0) === '/' || self.state.q.charAt(0) === '>') ? self.state.q.slice(1) : self.state.q }); },
      toggleActions: function () { self.setState({ actions: !self.state.actions }); },
      activate: function () { self.activateEntry(selEntry); },
      onQuery: function (ev) { self.setState({ q: ev.target.value, sel: 0, actions: false }); },
      onKey: function (ev) {
        var st = self.state;
        if (ev.key === 'Tab') {
          ev.preventDefault();
          var typed = st.q.trim().toLowerCase();
          if (typed && st.scope === 'all') {
            var hit = TAGS.filter(function (t) { return t.id !== 'all' && t.label.toLowerCase().indexOf(typed) === 0; })[0];
            if (hit) { self.setState({ scope: hit.id, q: '', sel: 0 }); return; }
          }
          var ids = TAGS.map(function (t) { return t.id; });
          var at = ids.indexOf(st.scope);
          var next = ids[(at + (ev.shiftKey ? ids.length - 1 : 1)) % ids.length];
          self.setState({ scope: next, sel: 0, actions: false });
        } else if (ev.key === 'ArrowDown') {
          ev.preventDefault(); self.setState({ sel: Math.min(st.sel + 1, Math.max(0, entries.length - 1)), actions: false });
        } else if (ev.key === 'ArrowUp') {
          ev.preventDefault(); self.setState({ sel: Math.max(st.sel - 1, 0), actions: false });
        } else if (ev.key === 'Enter') {
          ev.preventDefault(); self.activateEntry(selEntry);
        } else if (ev.key === 'Escape') {
          ev.preventDefault();
          if (st.actions) self.setState({ actions: false });
          else if (st.q) self.setState({ q: '', sel: 0 });
          else if (st.scope !== 'all') self.setState({ scope: 'all', sel: 0 });
          else self.say('Esc on an empty search hides the window');
        } else if (ev.key === 'Backspace' && !st.q && st.scope !== 'all') {
          ev.preventDefault(); self.setState({ scope: 'all', sel: 0 });
        } else if ((ev.ctrlKey || ev.metaKey) && (ev.key === 'k' || ev.key === 'K')) {
          ev.preventDefault(); self.setState({ actions: !st.actions });
        } else if ((ev.ctrlKey || ev.metaKey) && (ev.key === 'z' || ev.key === 'Z') && !st.q) {
          ev.preventDefault(); self.undo();
        }
      }
    };
  }
}
</script>
