<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The bar, after Omarchy 4's (shell/plugins/bar): a strip across the top, its widgets in
         five places, laid out by bar.json; each widget is widgets/<name>.js. -->
    <link rel="stylesheet" type="text/css" href="./bar.css" />
    <!-- The picked theme's colors (themes/render.ps1 writes it), kept current by theme.js. -->
    <link rel="stylesheet" type="text/css" href="./theme.css" />
    <link rel="stylesheet" type="text/css" href="./music.css" />
    <script type="module" src="./theme.js"></script>
  </head>
  <body>
    <div class="bar">
      <div class="side left" id="left"></div>
      <div class="middle">
        <div class="slot" id="centerBegin"></div>
        <div class="slot" id="center"></div>
        <div class="slot" id="centerEnd"></div>
      </div>
      <div class="side right" id="right"></div>
    </div>

    <!-- Plain JS, no build step. -->
    <script type="module">
      import * as zebar from 'https://esm.sh/zebar@3.3';

      const $ = id => document.getElementById(id);
      const config = await (await fetch('./bar.json', { cache: 'no-store' })).json();
      const clock = config.clock ?? {};
      const providers = zebar.createProviderGroup({
        glazewm: { type: 'glazewm' },
        date: { type: 'date', formatting: `${clock.format ?? 'EEEE HH:mm'}|${clock.formatAlt ?? "d MMMM 'W'WW yyyy"}` },
        media: { type: 'media' },
        network: { type: 'network', refreshInterval: 3000 },
        battery: { type: 'battery' },
        systray: { type: 'systray' },
        audio: { type: 'audio' },
      });

      // The bar's window is only as tall as the bar; while something drops down under it (a
      // panel, the music player) it grows to fit, and stays above other windows meanwhile.
      const BAR_HEIGHT = 26; // the preset's height in zpack.json
      let onTop = false;
      // One resize at a time, each measuring when it applies: two that overlap (a panel opening,
      // then filling in) could otherwise land in the wrong order and leave the window too short,
      // with the page scrolled out of view.
      let fitting = Promise.resolve();
      function fitWindow() {
        fitting = fitting.then(fitNow, fitNow);
        return fitting;
      }
      async function fitNow() {
        const win = zebar.currentWidget().tauriWindow;
        const open = document.querySelectorAll('.drop:not(.hidden)').length > 0;
        if (open !== onTop) {
          onTop = open;
          try { await win.setAlwaysOnTop(open); } catch (err) { console.error('could not raise the bar', err); }
        }
        const bottoms = [...document.querySelectorAll('.drop:not(.hidden)')].map(el => el.getBoundingClientRect().bottom);
        const height = bottoms.length ? Math.ceil(Math.max(...bottoms)) + 16 : BAR_HEIGHT;
        try { await win.setSize({ type: 'Logical', width: window.innerWidth, height }); } catch (err) { console.error('could not resize the bar', err); }
        window.scrollTo(0, 0);
      }
      // The page never scrolls: the bar stays at the top of its window whatever its size.
      window.addEventListener('scroll', () => { if (window.scrollY) window.scrollTo(0, 0); });

      // What every widget gets: the providers' output, ways to run things, and the drop-downs.
      const drops = [];
      const ctx = {
        zebar,
        config,
        $,
        esc: s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]),
        output: () => providers.outputMap,
        // A GlazeWM command, or a program through GlazeWM (omawin.exe: from GlazeWM, never a
        // bare "omawin", which resolves to the repo folder from there).
        glazewm: cmd => providers.outputMap.glazewm?.runCommand(cmd),
        omawin: args => providers.outputMap.glazewm?.runCommand(`shell-exec omawin.exe ${args}`),
        // A cell: a button with an icon slot.
        button(cls, html, title) {
          const el = document.createElement('button');
          el.className = cls;
          el.innerHTML = html;
          if (title) el.title = title;
          return el;
        },
        // A drop-down under the bar, centered under its widget; one open at a time.
        drop(cls) {
          const el = document.createElement('div');
          el.className = `drop ${cls} hidden`;
          document.body.appendChild(el);
          const d = {
            el,
            get open() { return !el.classList.contains('hidden'); },
            show(anchor) {
              drops.forEach(o => o !== d && o.hide());
              el.classList.remove('hidden');
              const a = anchor.getBoundingClientRect();
              const left = a.left + a.width / 2 - el.offsetWidth / 2;
              el.style.left = `${Math.max(6, Math.min(window.innerWidth - el.offsetWidth - 6, left))}px`;
              fitWindow();
            },
            hide() { if (d.open) { el.classList.add('hidden'); fitWindow(); } },
          };
          drops.push(d);
          return d;
        },
        fitWindow,
      };

      // The widgets, in bar.json's order, each in its place.
      const widgets = [];
      for (const place of ['left', 'centerBegin', 'center', 'centerEnd', 'right']) {
        for (const name of config[place] ?? []) {
          try {
            const mod = await import(`./widgets/${name}.js`);
            const w = mod.create(ctx);
            $(place).appendChild(w.el);
            widgets.push(w);
          } catch (err) {
            console.error(`widget ${name}`, err);
          }
        }
      }

      function render() {
        const o = providers.outputMap;
        for (const w of widgets) {
          try { w.update?.(o); } catch (err) { console.error('widget update', err); }
        }
      }

      // A click outside a drop-down, Esc, or leaving the bar's window closes it.
      document.addEventListener('mousedown', e => {
        for (const d of drops) if (d.open && !d.el.contains(e.target) && !e.target.closest('[data-drop]')) d.hide();
      });
      document.addEventListener('keydown', e => { if (e.key === 'Escape') drops.forEach(d => d.hide()); });
      window.addEventListener('blur', () => drops.forEach(d => d.hide()));
      document.addEventListener('contextmenu', e => e.preventDefault());

      providers.onOutput(render);
      render();
    </script>
  </body>
</html>
