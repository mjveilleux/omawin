<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" type="text/css" href="./styles.css" />
    <link rel="stylesheet" type="text/css" href="./dock.css" />
    <!-- The picked theme's colors (themes/render.ps1 writes it), kept current by theme.js. -->
    <link rel="stylesheet" type="text/css" href="./theme.css" />
    <script type="module" src="./theme.js"></script>
  </head>
  <body>
    <!-- The bottom dock, in place of the Windows taskbar (which auto-hides): Windows' own
         buttons on the left, every open window in the middle, quick settings on the right. -->
    <div class="dock">
      <div class="island group" id="system"></div>
      <div class="island group apps" id="apps"></div>
      <div class="island group" id="tray"></div>
    </div>
    <div class="tip hidden" id="tip"></div>

    <script type="module">
      import * as zebar from 'https://esm.sh/zebar@3.3';

      const providers = zebar.createProviderGroup({ glazewm: { type: 'glazewm' } });
      const $ = id => document.getElementById(id);
      const esc = s =>
        String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

      // Buttons: a Nerd Font glyph, a name, and the GlazeWM command it runs (shell-exec starts
      // a program or a URI; win-keys presses a Windows-key shortcut, for what has no command).
      const button = (glyph, name, cmd, cls = '') =>
        `<button class="dock-btn ${cls}" data-cmd="${esc(cmd)}" data-tip="${esc(name)}"><span class="glyph">${glyph}</span></button>`;
      $('system').innerHTML = [
        button('\u{F05B3}', 'Start', 'shell-exec win-keys win', 'start'),
        button('\u{F0349}', 'Search', 'shell-exec win-keys win+s'),
        button('\u{F024B}', 'File Explorer', 'shell-exec explorer'),
        button('\u{F0493}', 'Settings', 'shell-exec explorer ms-settings:'),
        button('\u{F0A07}', 'Task manager (btop)', 'shell-exec --hide-window omawin.exe launch terminal --title btop -- btop.cmd'),
        '<span class="sep"></span>',
        button('\u{F0B8A}', 'Launcher  (Win+Space)', 'shell-exec --hide-window omawin.exe launcher'),
        button('\u{F035C}', 'System menu  (Win+Alt+Space)', 'shell-exec --hide-window omawin.exe menu'),
      ].join('');
      $('tray').innerHTML = [
        button('\u{F0521}', 'Quick settings', 'shell-exec win-keys win+a'),
        button('\u{F009A}', 'Notifications', 'shell-exec explorer ms-actioncenter:'),
        button('\u{F01C4}', 'Show desktop', 'shell-exec win-keys win+d'),
      ].join('');

      // --- windows ---------------------------------------------------------------------------
      // The real app icons, from app-icons (~/.local/bin, built from app-icons.cs), fetched
      // once per app and kept (localStorage). Store apps all run as ApplicationFrameHost, so
      // they're told apart by title.
      const iconKey = w => {
        const p = (w.processName ?? '').toLowerCase();
        return p === 'applicationframehost' ? `afh:${w.title}` : p;
      };
      let icons = {};
      try { icons = JSON.parse(localStorage.getItem('dock-icons') ?? '{}'); } catch {}
      const asking = new Set();
      async function fetchIcons(windows) {
        const missing = windows.filter(w => !(iconKey(w) in icons) && !asking.has(iconKey(w)));
        if (!missing.length) return;
        missing.forEach(w => asking.add(iconKey(w)));
        try {
          const out = await zebar.shellExec('app-icons', missing.map(w => String(w.handle)));
          const urls = Object.fromEntries(
            String(out.stdout).trim().split(/\r?\n/).map(l => l.split(' ')),
          );
          missing.forEach(w => {
            const url = urls[String(w.handle)];
            icons[iconKey(w)] = url && url !== '-' ? url : null;
          });
          try { localStorage.setItem('dock-icons', JSON.stringify(icons)); } catch {}
          render();
        } catch (err) {
          console.error('app-icons unavailable', err);
        } finally {
          missing.forEach(w => asking.delete(iconKey(w)));
        }
      }

      const windowsOf = c => (c.children ?? []).flatMap(x => (x.type === 'window' ? [x] : windowsOf(x)));
      // Every window, by workspace (in number order), with a thin divider between workspaces.
      function renderApps(wm) {
        if (!wm) return '';
        const workspaces = [...(wm.allWorkspaces ?? wm.currentWorkspaces)].sort(
          (a, b) => (parseInt(a.name) || 99) - (parseInt(b.name) || 99) || a.name.localeCompare(b.name),
        );
        const groups = workspaces
          .map(ws => {
            const wins = windowsOf(ws);
            if (!wins.length) return '';
            return wins
              .map(w => {
                const url = icons[iconKey(w)];
                const glyph = url ? `<img src="${url}" />` : `<span class="glyph">\u{F0614}</span>`;
                const cls = [
                  'dock-btn',
                  'app',
                  w.hasFocus && 'focused',
                  ws.isDisplayed && 'here',
                  w.state?.type === 'minimized' && 'minimized',
                ].filter(Boolean).join(' ');
                return `<button class="${cls}" data-cmd="focus --container-id ${esc(w.id)}" data-tip="${esc(w.title || w.processName)}" data-ws="${esc(ws.displayName ?? ws.name)}">${glyph}<span class="dot"></span></button>`;
              })
              .join('');
          })
          .filter(Boolean);
        fetchIcons(workspaces.flatMap(windowsOf));
        return groups.join('<span class="sep"></span>') || '<span class="empty">no windows</span>';
      }

      let lastApps = '';
      function render() {
        const html = renderApps(providers.outputMap.glazewm);
        if (html !== lastApps) {
          lastApps = html;
          $('apps').innerHTML = html;
        }
      }

      // Hover: the name / window title in a bubble above the button. The dock's window is only
      // as tall as the dock (so it never covers the bottom of other windows); it grows upward
      // while a bubble shows.
      const TIP_ROOM = 40;
      const win = zebar.currentWidget().tauriWindow;
      let tall = false;
      let growing = Promise.resolve();
      function setTall(on) {
        if (on === tall) return;
        tall = on;
        growing = growing.then(async () => {
          try {
            const f = await win.scaleFactor();
            const pos = await win.outerPosition();
            const size = await win.innerSize();
            const extra = Math.round(TIP_ROOM * f) * (on ? 1 : -1);
            if (on) {
              await win.setPosition({ type: 'Physical', x: pos.x, y: pos.y - extra });
              await win.setSize({ type: 'Physical', width: size.width, height: size.height + extra });
            } else {
              await win.setSize({ type: 'Physical', width: size.width, height: size.height + extra });
              await win.setPosition({ type: 'Physical', x: pos.x, y: pos.y - extra });
            }
          } catch (err) {
            console.error('could not resize the dock', err);
          }
        });
      }
      let tipTimer = null;
      document.addEventListener('mouseover', e => {
        const el = e.target.closest('[data-tip]');
        const tip = $('tip');
        clearTimeout(tipTimer);
        if (!el) {
          tip.classList.add('hidden');
          tipTimer = setTimeout(() => setTall(false), 150);
          return;
        }
        setTall(true);
        tip.textContent = el.dataset.ws ? `${el.dataset.tip}  ·  ${el.dataset.ws}` : el.dataset.tip;
        tip.classList.remove('hidden');
        const r = el.getBoundingClientRect();
        tip.style.left = `${Math.max(8, Math.min(window.innerWidth - tip.offsetWidth - 8, r.left + r.width / 2 - tip.offsetWidth / 2))}px`;
      });
      document.addEventListener('mouseleave', () => {
        $('tip').classList.add('hidden');
        clearTimeout(tipTimer);
        tipTimer = setTimeout(() => setTall(false), 150);
      });
      document.addEventListener('click', e => {
        const el = e.target.closest('[data-cmd]');
        if (el) providers.outputMap.glazewm?.runCommand(el.dataset.cmd);
      });
      document.addEventListener('contextmenu', e => e.preventDefault());

      providers.onOutput(render);
      render();
    </script>
  </body>
</html>
